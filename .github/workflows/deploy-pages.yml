name: 部署 SmithNav 到 Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: smithnav-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: 安装锁定的依赖
        run: pnpm install --frozen-lockfile
      - name: 运行测试
        run: node --test tests/*.test.mjs
      - name: 构建网站
        run: node scripts/build.mjs
      - name: 创建资源、迁移并部署
        run: node scripts/deploy-pages.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
          WRANGLER_SEND_METRICS: 'false'
